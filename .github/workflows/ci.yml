name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Verify type definitions are installed
        run: |
          test -d node_modules/@types/react || { echo "::error::@types/react missing"; exit 1; }
          test -d node_modules/@types/react-dom || { echo "::error::@types/react-dom missing"; exit 1; }
      - run: npx tsc --noEmit
      - run: npm run build
